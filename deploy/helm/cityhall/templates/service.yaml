apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "cityhall.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cityhall.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
    {{- if .Values.workspaces.enabled }}
    - name: ws-proxy
      port: {{ .Values.workspaces.proxy.port }}
      targetPort: ws-proxy
    {{- end }}
