{{- if .Values.postgres.enabled }}
# Only the CityHall API pod may reach the bundled Postgres. Enforcement requires
# a CNI with NetworkPolicy support.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "cityhall.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cityhall-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cityhall.selector" . | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
