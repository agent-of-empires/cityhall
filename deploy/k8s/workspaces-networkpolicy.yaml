# Workspace pods run `aoe serve --auth token`; the proxy holds each bearer
# token. This policy is defense in depth: it keeps every other pod in the
# cluster away from them. Enforcement requires a CNI with NetworkPolicy support.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cityhall-workspaces
  namespace: cityhall
spec:
  podSelector:
    matchLabels:
      cityhall.managed: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cityhall
      ports:
        - port: 8080
