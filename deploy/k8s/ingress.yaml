# The nginx example (ingress-nginx + cert-manager). Adjust annotations/host for
# your setup. For the AWS Load Balancer Controller use the Helm chart with
# helm/cityhall/examples/values-alb.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cityhall
  namespace: cityhall
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cityhall.example.com
      secretName: cityhall-tls
  rules:
    - host: cityhall.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cityhall
                port:
                  number: 80
