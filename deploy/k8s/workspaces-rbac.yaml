# Lets CityHall manage per-user workspace objects (Deployment + Service + PVC +
# Secret, plus reading pod status) in its namespace via the kubernetes workspace
# backend (WORKSPACE_BACKEND=kubernetes).
#
# This grants CityHall itself. What it cannot do is limit everyone else: the
# workspace bundle token and every agent credential live in the per-user Secret
# precisely so they are not in the Deployment, and that only helps while reading
# a Deployment in this namespace does not also mean reading its Secrets. If you
# add roles here, keep "secrets" read narrower than "deployments" read. A single
# workspace Secret is enough to fetch that user's whole config bundle, which
# includes their decrypted git token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cityhall
  namespace: cityhall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cityhall-workspaces
  namespace: cityhall
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  # A per-user Secret carries the workspace's bundle token and agent
  # credentials, so those values stay out of the Deployment manifest. "get" is
  # needed as well as the writes: `kubectl apply` is client-side and reads the
  # live object to compute its merge patch.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cityhall-workspaces
  namespace: cityhall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cityhall-workspaces
subjects:
  - kind: ServiceAccount
    name: cityhall
    namespace: cityhall
