name: Images

# Builds the app image (root Dockerfile) and the reference workspace image
# (deploy/aoe-image/Dockerfile) and pushes them to ghcr.io on main and on
# version tags. Pull requests build only (amd64 only, to keep the check short):
# fork PRs get no write token. The workspace image is built daily for the latest
# stable aoe release, so the default image_template (<repo>:{version}) always
# resolves to a published tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - deploy/aoe-image/**
      - .github/workflows/images.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      aoe_version:
        description: aoe release tag for the workspace image (default is the latest stable release)
        required: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_IMAGE: ghcr.io/agent-of-empires/cityhall
  WORKSPACE_IMAGE: ghcr.io/agent-of-empires/cityhall-aoe
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  app:
    name: App image
    # Scheduled runs only keep the workspace image current; they must not move
    # the app's sha- and main tags.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      # Single-platform build into the local daemon, for the smoke test below.
      - name: Build (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cityhall-smoke
          cache-from: type=gha,scope=app
      - name: Smoke test GET /api/health
        run: |
          docker run -d --name smoke -p 3000:3000 cityhall-smoke
          for _ in $(seq 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  workspace:
    name: Workspace image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The manual input if given, else the latest stable aoe release (the
      # source CityHall's seed_default_version uses). The value is validated
      # before any later step sees it.
      - name: Resolve aoe version
        id: aoe
        env:
          INPUT_VERSION: ${{ inputs.aoe_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(gh api 'repos/agent-of-empires/agent-of-empires/releases?per_page=100' \
              --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid aoe version: '$v'" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A scheduled run exists to publish a new aoe version; if the tag is
      # already there, skip the build so published tags never move.
      - name: Skip if already published
        id: exists
        if: github.event_name == 'schedule'
        env:
          TAG: ${{ env.WORKSPACE_IMAGE }}:${{ steps.aoe.outputs.version }}
        run: |
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUSH == 'true' && steps.exists.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.skip != 'true'
      # Single-platform build into the local daemon, to check the label the
      # docker backend refuses to start an image without.
      - name: Build (amd64, local)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/aoe-image
          platforms: linux/amd64
          build-args: AOE_VERSION=${{ steps.aoe.outputs.version }}
          load: true
          tags: cityhall-aoe-check
          cache-from: type=gha,scope=workspace
      - name: Check cityhall.home-volume label
        if: steps.exists.outputs.skip != 'true'
        run: |
          label=$(docker image inspect --format '{{index .Config.Labels "cityhall.home-volume"}}' cityhall-aoe-check)
          test "$label" = 1 || { echo "cityhall.home-volume label is '$label', want 1"; exit 1; }
      - name: Build and push (amd64, arm64)
        id: push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/aoe-image
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: AOE_VERSION=${{ steps.aoe.outputs.version }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.WORKSPACE_IMAGE }}:${{ steps.aoe.outputs.version }}
            ${{ env.WORKSPACE_IMAGE }}:${{ steps.aoe.outputs.version }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true' && steps.exists.outputs.skip != 'true'
        with:
          subject-name: ${{ env.WORKSPACE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
